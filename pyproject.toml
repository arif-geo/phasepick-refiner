[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "phasepick-refiner"
version = "0.1.0"
description = "Cluster-based cross-correlation refinement of seismic P and S picks"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Md Ariful Islam"}
]
dependencies = [
    "numpy>=1.23",
    "pandas>=1.5",
    "matplotlib>=3.6",
    "obspy>=1.4"
]

[project.optional-dependencies]
gui = ["PyQt5>=5.15"]
yaml = ["PyYAML>=6"]

[project.scripts]
phasepick-refiner = "phasepick_refiner.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

